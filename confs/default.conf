server {
	# listen 0.0.0.0:3469;
	listen 0.0.0.0:8080;

	server_name webserv_a.com;
	client_timeout 5; # seconds
	max_body_size 1; # megabytes

	location / {
		methods GET POST;
		root ./www/html;
		index index.html;
	}

	location /files {
		methods POST GET DELETE;
		root ./www/html/files;
		autoindex on;
	}

	location /no_files {
		methods POST GET DELETE;
		root ./www/html/files;
		# No autoindex -> Forbidden
	}

	location /php {
		methods GET POST;
		cgi_php /usr/bin/php-cgi;
		root ./www/html/cgi/php;
		index index.php;
	}

	location /python {
		methods GET POST;
		root ./www/html/cgi/python;
		cgi_python /usr/bin/python3;
		index index.py;
	}

	location /admin {
		methods GET;
		return 308 /home;
	}

	location /cookie-clicker {
		methods GET POST;
		root ./www/html/cgi/python;
		cgi_python /usr/bin/python3;
		index cookie_clicker.py;
	}
}

server {
	listen 0.0.0.0:9090;

	server_name webserv_b.com;
  client_timeout 5;
	max_body_size 1;

	location / {
		methods GET POST GET;
		root /var/www/site2;
		index index.html;
	}
}
