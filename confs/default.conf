server {
	listen 8080;
	listen 0.0.0.0:8080;

	server_name test_webserv.com;

	location / {
		methods GET POST;
		root ./www/html;
		index index.html;
	}

	# We should manage php for our bonus CGI
	location /delete {
		methods DELETE;
		cgi_php /absolute/path/delete.php;
	}
}

server {
	listen 9090;
	listen 0.0.0.0:9090;

	server_name webserv_b.com;

	location / {
		methods GET POST GET;
		root /var/www/site2;
		index index.html;
		try_files $uri $uri/ =404;
	}
}
