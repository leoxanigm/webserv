server {
	listen 8080;
	listen 0.0.0.0:8080;

	server_name test_webserv.com;

	location / {
		methods GET POST;
		root ./www/html;
		index index.html;
	}

	location /files {
		methods GET POST DELETE;
		root ./www/html/files;
		index index.html;
	}

	location /cookie-clicker {
		methods GET POST;
		root ./www/html/cgi/python;
		index cookie_clicker.py;
		cgi_python /usr/bin/python3;
	}
}

server {
	listen 9090;
	listen 0.0.0.0:9090;

	server_name webserv_b.com;

	location / {
		methods GET POST GET;
		root /var/www/site2;
		index index.html;
		try_files $uri $uri/ =404;
	}
}
