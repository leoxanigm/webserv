server {
	# listen 0.0.0.0:3469;
	listen 0.0.0.0:8080;

	server_name webserv_a.com;
	client_timeout 10; # seconds
	max_body_size 1; # megabytes

	location / {
		methods GET;
		root ./www/html;
		index index.html;
	}

	location /files {
		methods POST GET DELETE;
		root ./www/html/files;
		autoindex on;
	}

	location /no_files {
		methods POST GET DELETE;
		root ./www/html/files;
		# No autoindex -> Forbidden
	}

	location /gallery {
		methods GET POST;
		root ./www/html/gallery;
		cgi_php /usr/bin/php-cgi;
		index index.php;
	}

	location /blog {
		methods GET POST;
		root ./www/html/blog;
		cgi_python /usr/bin/python3;
		index index.py;
	}

	location /admin {
		methods GET;
		return 308 /;
	}

	location /cookie-clicker {
		methods GET POST;
		root ./www/html/cookie-clicker;
		cgi_python /usr/bin/python3;
		index cookie_clicker.py;
	}
}

server {
	listen 0.0.0.0:9090;

	server_name webserv_b.com;
  client_timeout 10;
	max_body_size 1;

	location / {
		methods GET POST GET;
		root /var/www/site2;
		index index.html;
	}
}
