server {
	listen 8080;
	listen 0.0.0.0:8080;

	server_name webserv_a.com;
	client_timeout 60; # seconds
	max_body_size 1; # megabytes

	location / {
		methods GET POST;
		root ./www/html;
		index index.html;
	}

	location /files {
		methods POST GET DELETE;
		root ./www/html/files;
		autoindex on;
	}

	# We should manage php for our bonus CGI
	location /delet\\e {
		methods DELETE;
		cgi_php /absolute/path/delete.php;
	}

	location /blog {
		cgi_python /absolute/path/blog.py;
	}

	location /admin {
		methods GET;
		return 301 /home;
	}
}

server {
	listen 9090;
	listen 0.0.0.0:9090;

	server_name webserv_b.com;

	location / {
		methods GET POST GET;
		root /var/www/site2;
		index index.html;
		try_files $uri $uri/ =404;
	}
}
