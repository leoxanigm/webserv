server {
	listen 8080 default_server;
	listen [::]:8080 default_server;

	server_name webserv_a.com;

	location / {
		root /var/www/html;
		index index.html;
		try_files $uri $uri/ =404;
		autoindex on;
	}

	# We should manage php for our bonus CGI
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
	
		fastcgi_pass unix:/run/php/php7.4-fpm.sock;
		fastcgi_pass 127.0.0.1:9000;
	}

	# Deny access to all the files ending with .xyz
	location ~ /\.xyz {
		deny all;
	}
}

server {
	listen 9090;
	listen [::]:9090;

	server_name webserv_b.com;

	location / {
		root /var/www/site2;
		index index.html;
		try_files $uri $uri/ =404;
	}
}
