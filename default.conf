server {
	listen 3469;
	listen 0.0.0.0:3469;

	server_name webserv_a.com;
	client_timeout 60; # seconds
	max_body_size 1; # megabytes

	location / {
		methods GET POST;
		root ./www/html;
		index index.html;
	}

	location /files {
		methods POST GET DELETE;
		root ./www/html/files;
		autoindex on;
	}

	# We should manage php for our bonus CGI 
	location /php {
		methods GET POST;
		# cgi_php /absolute/path/delete.php;
		cgi_php /usr/bin/php-cgi;
    	root ./www/html/cgi/php;
		index index.php;
	}

	location /python {
		methods GET POST;
		root ./www/html/cgi/python;
		cgi_python /usr/bin/python3;
		index index.py;
	}

	location /cookie-clicker {
		methods GET POST;
		root ./www/html/cgi/python;
		cgi_python /usr/bin/python3;
		index cookie_clicker.py;
	}

	location /admin {
		methods GET;
		return 301 /home;
	}

	location /python {
		methods GET POST;
		root ./www/html/cgi/python;
		cgi_python /usr/bin/python3;
		index index.py;
	}

	location /cookie-clicker {
		methods GET POST;
		root ./www/html/cgi/python;
		cgi_python /usr/bin/python3;
		index cookie_clicker.py;
	}
}

server {
	listen 9090;
	listen 0.0.0.0:9090;

	server_name webserv_b.com;

	location / {
		methods GET POST GET;
		root /var/www/site2;
		index index.html;
		try_files $uri $uri/ =404;
	}
}
