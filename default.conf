server {
	listen 8080;
	listen 0.0.0.0:8080;

	server_name webserv_a.com;

	location / {
		root ./www/html;
		index index.html;
	}

	location /files {
		root ./www/html/files;
		autoindex on;
	}

	# We should manage php for our bonus CGI
	location /home {
		cgi_php /absolute/path/home.php;
	}

	location /blog {
		cgi_python /absolute/path/blog.py;
	}

	# Deny access to all the files ending with .xyz
	location ~ /\.xyz {
		deny all;
	}

	location /admin {
		return 301 /home;
	}
}

server {
	listen 9090;
	listen 0.0.0.0:9090;

	server_name webserv_b.com;

	location / {
		root /var/www/site2;
		index index.html;
		try_files $uri $uri/ =404;
	}
}
